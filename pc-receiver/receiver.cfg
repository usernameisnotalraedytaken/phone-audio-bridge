# SNAD 接收器配置
# 首次运行自动生成。所有字段都可省略，省略即沿用内置预设。
# 修改后重启接收器生效。

# 当前选用的档位：lowlatency / balanced / highquality，或下面自定义的档位名
profile = balanced

# ---- 内置档位的字段含义 ----
# targetbuffer   抖动缓冲目标水位(ms)   延迟的最大单项
# prebuffer      起播预填充(ms)         越大起播越稳、等待越久
# ringcapacity   环形缓冲容量(ms)       决定能吸收多大突发
# block          每次提交给 waveOut 的时长(ms)
# poll           轮询间隔(ms)
# waveoutbuffers waveOut 缓冲个数        越多越抗调度抖动
# lead           播完提前量(ms)         给时钟偏差留的余地
# driftrange     漂移比率摆幅(如 0.08 = ±8%)
# driftgain      漂移控制增益           越大收敛快、易振荡
# ratiomin/max   读侧比率安全钳位
# formatwait     等待首个包的秒数
# prebufferwait  等待预填充的秒数

# ---- 自定义档位示例（去掉 # 即可启用）----
# [profile:gaming]
# description = 自用游戏档：尽量压延迟
# targetbuffer = 25
# prebuffer = 15
# ringcapacity = 60
# block = 6
# waveoutbuffers = 6
# lead = 20
# driftrange = 0.02
# driftgain = 0.10

