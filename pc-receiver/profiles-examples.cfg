# SNAD 示例档位集（计划 §10 交付）
#
# 用法：在主界面 CONFIG 里用 IMPORT 导入本文件，或在 receiver.cfg 里追加。
# 每个值都可以再改——这里给的是**有实测依据的起点**，不是推荐配置清单。
#
# 延迟口径统一为端到端实测（经接收器 → 环形缓冲 → 输出，回环录回），
# 详见 LATENCY-MEASURED.md 的矩阵一节。测量机：Realtek 板载扬声器、48 kHz。

# ---------------------------------------------------------------- 低延迟
#
# 136.69 ms（块 16 × 池 4）。同档位池 16 时是 328.65 ms，所以差值全在池上。
#
# 需要提醒的是：池=4 的**长期稳定性尚未验证**。短测里欠载 2 次、丢帧 0，
# 但没有做过长时间、差网络条件下的对照。若听到断续，先把池调到 8
# （204.77 ms），那是同一张表里已经测过的下一个台阶。
[profile:low-latency]
description = 池压到 4 个块的极简配置；延迟最低，但抗抖余量小
tags = lowlatency,waveout,measured
backend = waveout
targetbuffer = 80
prebuffer = 60
ringcapacity = 250
block = 16
waveoutbuffers = 4
buffermode = static
dither = off

# ---------------------------------------------------------------- 抗抖动
#
# 自适应缓冲：下限 80、上限 240，按实测抖动自动加厚。
# 抖动大的网络下会自己升到 200 ms 上下，安静时回落到 80。
# 池保持 16 个块，因为自适应需要池有足够余量来吸收调整过程。
[profile:anti-jitter]
description = 自适应缓冲，按实时抖动自动加厚；抖动大时延迟上升，安静时回落
tags = jitter,adaptive,waveout
backend = waveout
targetbuffer = 80
prebuffer = 80
ringcapacity = 400
block = 16
waveoutbuffers = 16
buffermode = adaptive
minbuffer = 80
maxbuffer = 240
adaptrate = 0.05
dither = off

# ---------------------------------------------------------------- 高音质
#
# WASAPI 共享 + float32 + 抖动。共享模式跟随设备混音格式（本机为 float32），
# 因此这条路径上"高音质"意味着**不在采集与输出两端额外砍位深**。
# 实测 195.73 ms（周期 3 ms）。
[profile:high-quality]
description = WASAPI 共享 + float32 + 位深抖动；精度优先，延迟中等
tags = quality,wasapi,float32,dither
backend = wasapi_shared
wasapiperiod = 3
format = float32
samplerate = follow
targetbuffer = 80
prebuffer = 60
ringcapacity = 250
block = 16
buffermode = static
dither = on

# ---------------------------------------------------------------- 标定结果
#
# 标定模式（calibrated）会在启动后 1500 ms 内观察一次抖动分布，
# 然后锁定深度并写回 calibratedon。下面是本机实测落点：
# 目标 80 ms 起步，标定后稳定在 75–90 ms。
#
# calibratedon 记录标定来源设备——换设备后应当重新标定，
# 否则这个字段会与实际不符。
[profile:calibrated]
description = 启动时探测一次抖动分布后锁定深度；适合网络状况稳定的场合
tags = calibrated,waveout
backend = waveout
targetbuffer = 80
prebuffer = 60
ringcapacity = 250
block = 16
waveoutbuffers = 16
buffermode = calibrated
minbuffer = 40
maxbuffer = 160
calibratesec = 2
calibratedon = 扬声器 (Realtek(R) Audio)
dither = off
