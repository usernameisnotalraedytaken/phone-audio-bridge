name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 自动创建 Release 需要

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不使用 android-actions/setup-android@v3：
      # ubuntu-24.04 运行器已预装 Android SDK，而该 action 检测到预装 sdkmanager
      # 版本不匹配后会执行 `sdkmanager tools`，该包在现代 SDK 中已不存在，导致
      # "Warning: Failed to find package 'tools'" 并让整个 job 失败。
      # 这里只做验证，缺什么再用 sdkmanager 明确安装。
      - name: Verify preinstalled Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls -1 "$SDK" || true
          if [ ! -d "$SDK/platforms" ]; then
            echo "::error::SDK 中缺少 platforms 目录"
            exit 1
          fi
          echo "已安装的 platforms:"; ls -1 "$SDK/platforms"
          echo "已安装的 build-tools:"; ls -1 "$SDK/build-tools" || true
          if [ ! -d "$SDK/platforms/android-35" ]; then
            echo "android-35 缺失，尝试安装"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi

      # 预共享密钥在构建时注入，不存放在源码里。
      # 仓库 public 时使用仓库 secret SNAD_PSK；未配置则回退到仓库内的
      # .snad-key 文件（该文件已 gitignore，因此本地构建可用、CI 若未设置 secret 会明确失败）。
      # 绝不回退到某个默认密钥——那等于没有保护。
      - name: Inject pre-shared key
        env:
          SNAD_PSK_SECRET: ${{ secrets.SNAD_PSK }}
        run: |
          set -eux
          PSK="$SNAD_PSK_SECRET"
          if [ -z "$PSK" ] && [ -f .snad-key ]; then
            PSK="$(tr -d ' \r\n' < .snad-key)"
            echo "使用仓库内 .snad-key"
          fi
          if [ -z "$PSK" ]; then
            echo "::error::未提供预共享密钥。请在仓库 Settings→Secrets 配置 SNAD_PSK，或提交 .snad-key（不推荐）。"
            exit 1
          fi
          KEYID=$(printf '%s' "$PSK" | sha256sum | cut -c1-16 | tr 'a-f' 'A-F')
          echo "KeyId=$KEYID（两端必须一致）"
          mkdir -p app/src/main/java/com/dicaeopolis/snad
          cat > app/src/main/java/com/dicaeopolis/snad/SnadSecret.kt <<EOF
          package com.dicaeopolis.snad

          // 本文件由 CI 生成，请勿手工编辑，也不要提交到版本库。
          internal object SnadSecret {
              const val KEY_ID = "$KEYID"
              const val PSK = "$PSK"
          }
          EOF
          # 生成后立即校验：KeyId 必须与代码里按同一规则算出来的一致
          echo "已生成 SnadSecret.kt（PSK 长度 ${#PSK}）"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -eux
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK + checksum
        id: collect
        run: |
          set -eux
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" SNAD-debug.apk
          sha256sum SNAD-debug.apk | tee SNAD-debug.apk.sha256
          ls -la SNAD-debug.apk
          echo "sha=$(cut -d' ' -f1 SNAD-debug.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAD-debug-apk
          path: |
            SNAD-debug.apk
            SNAD-debug.apk.sha256

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --title "SNAD build ${GITHUB_RUN_NUMBER}" \
            --notes "自动构建。SHA256: ${{ steps.collect.outputs.sha }}" \
            SNAD-debug.apk SNAD-debug.apk.sha256
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SNAD-debug.apk" >> "$GITHUB_STEP_SUMMARY"
